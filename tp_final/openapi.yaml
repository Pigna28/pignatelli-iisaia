        '403':
          description: Sin permiso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Contadores globales de hilos. tests = passed + failed + in_progress;
        cada hilo cuenta una vez, sin importar sus pasos.
  /session:
    get:
