components:
  parameters:
    ChipId:
      name: chipId
      in: path
      required: true
      description: Identificador del chip.
      schema:
        type: integer
        minimum: 1
    Macro:
      name: macro
      in: path
      required: true
      description: Macro interna del chip sobre la que se organizan los ensayos.
      schema:
        type: string
        enum:
        - Tx
        - Rx
        - PLL
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Valor csrf_token de GET /session, usando la misma cookie.
      schema:
        type: string
  schemas:
    Chip:
      type: object
      description: Muestra física de un chip registrada en el sistema.
      required:
      - id
      - part_number
      - board
      properties:
        id:
          type: integer
          description: Identificador único del chip, asignado por el servidor.
          minimum: 1
        part_number:
          type: string
          description: Número de parte del chip.
          examples:
          - CHIP001
          minLength: 1
          maxLength: 120
        board:
          type: string
          description: Placa o kit de evaluación en la que está montado el chip.
          examples:
          - EVK-1
          minLength: 1
          maxLength: 120
        assembled_at:
          type: string
          format: date
          description: Fecha de ensamblado de la muestra.
      additionalProperties: false
    ChipInput:
      type: object
      description: Datos necesarios para registrar un nuevo chip.
      required:
      - part_number
      - board
      properties:
        part_number:
          type: string
          examples:
          - CHIP001
          minLength: 1
          maxLength: 120
        board:
          type: string
          examples:
          - EVK-1
          minLength: 1
          maxLength: 120
        assembled_at:
          type: string
          format: date
      additionalProperties: false
    Test:
      type: object
      description: Ensayo de caracterización ejecutado sobre una macro de un chip.
      required:
      - id
      - chip_id
      - macro
      - metric
      - measured_value
      - unit
      - passed
      properties:
        id:
          type: integer
          description: Identificador único del ensayo, asignado por el servidor.
          minimum: 1
        chip_id:
          type: integer
          description: Identificador del chip al que pertenece el ensayo, tomado del
            parámetro {chipId} del path.
          minimum: 1
        macro:
          type: string
          enum:
          - Tx
          - Rx
          - PLL
          description: Macro sobre la que se ejecutó el ensayo, tomada del parámetro
            {macro} del path.
        metric:
          type: string
          description: Nombre del parámetro medido.
          examples:
          - gain
          minLength: 1
          maxLength: 120
        measured_value:
          type: number
          format: float
          description: Valor medido para la métrica.
        unit:
          type: string
          description: Unidad de la métrica medida.
          examples:
          - dB
          minLength: 1
          maxLength: 120
        passed:
          type: boolean
          description: Indica si el ensayo fue aprobado.
        measured_at:
          type: string
          format: date-time
          description: Fecha y hora en que se realizó la medición.
      additionalProperties: false
    TestInput:
      type: object
      description: Datos transportados en el body para registrar un nuevo ensayo.
      required:
      - metric
      - measured_value
      - unit
      - passed
      properties:
        metric:
          type: string
          examples:
          - gain
          minLength: 1
          maxLength: 120
        measured_value:
          type: number
          format: float
        unit:
          type: string
          examples:
          - dB
          minLength: 1
          maxLength: 120
        passed:
          type: boolean
        measured_at:
          type: string
          format: date-time
      additionalProperties: false
    Error:
      type: object
      description: Respuesta de error estándar.
      required:
      - error
      properties:
        error:
          type: string
          description: Mensaje descriptivo del problema.
    Summary:
      type: object
      additionalProperties: false
      required:
      - chips
      - tests
      - passed
      - failed
      - in_progress
      properties:
        chips:
          type: integer
          minimum: 0
        tests:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        in_progress:
          type: integer
          minimum: 0
    Session:
      type: object
      required:
      - user
      - can_write
      - mode
      - csrf_token
      properties:
        user:
          type: object
          required:
          - sub
          - name
          properties:
            sub:
              type: string
            name:
              type: string
        can_write:
          type: boolean
        mode:
          enum:
          - local
          - auth0
        csrf_token:
          type: string
    AuditEvent:
      type: object
      required:
      - id
      - occurred_at
      - actor
      - action
      - resource
      - resource_id
      - snapshot
      properties:
        id:
          type: integer
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          enum:
          - create
          - update
          - delete
        resource:
          enum:
          - chip
          - test
          - thread
          - step
          - attachment
        resource_id:
          type: integer
        snapshot:
          type: object
          additionalProperties: true
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinkInput:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        url:
          type: string
          maxLength: 2048
          title: Url
      additionalProperties: false
      type: object
      required:
      - name
      - url
      title: LinkInput
    StepInput:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        notes:
          type: string
          maxLength: 10000
          title: Notes
          default: ''
        status:
          type: string
          enum:
          - in_progress
          - passed
          - failed
          title: Status
          default: in_progress
        metric:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Metric
        measured_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Measured Value
        unit:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Unit
        measured_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Measured At
      additionalProperties: false
      type: object
      required:
      - title
      title: StepInput
    ThreadInput:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        description:
          type: string
          maxLength: 10000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - title
      title: ThreadInput
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Thread:
      type: object
      properties:
        id: &id001
          type: integer
          minimum: 1
        chip_id: *id001
        macro: &id009
          enum:
          - Tx
          - Rx
          - PLL
        title: *id002
        description: *id002
        created_at: &id003
          type: string
          format: date-time
        part_number: *id002
        board: *id002
        step_count: &id010
          type: integer
          minimum: 0
        status: &id004
          type: string
          enum:
          - in_progress
          - passed
          - failed
      required:
      - id
      - chip_id
      - macro
      - title
      - description
      - created_at
      - part_number
      - board
      - step_count
      - status
      additionalProperties: false
    Attachment:
      type: object
      properties:
        id: *id001
        step_id: *id001
        kind:
          enum:
          - file
          - link
        name: *id002
        url:
          type:
          - string
          - 'null'
        size:
          type: integer
          minimum: 0
        created_at: *id003
      required:
      - id
      - step_id
      - kind
      - name
      - url
      - size
      - created_at
      additionalProperties: false
    Step:
      type: object
      properties:
        id: *id001
        thread_id: *id001
        title: *id002
        notes: *id002
        status: *id004
        metric: &id005
          type:
          - string
          - 'null'
        measured_value: &id006
          type:
          - number
          - 'null'
        unit: &id007
          type:
          - string
          - 'null'
        measured_at: &id008
          type:
          - string
          - 'null'
          format: date-time
        created_at: *id003
        updated_at: *id003
      required:
      - id
      - thread_id
      - title
      - notes
      - status
      - metric
      - measured_value
      - unit
      - measured_at
      - created_at
      - updated_at
      additionalProperties: false
    StepDetail:
      type: object
      properties:
        id: *id001
        thread_id: *id001
        title: *id002
        notes: *id002
        status: *id004
        metric: *id005
        measured_value: *id006
        unit: *id007
        measured_at: *id008
        created_at: *id003
        updated_at: *id003
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
      required:
      - id
      - thread_id
      - title
      - notes
      - status
      - metric
      - measured_value
      - unit
      - measured_at
      - created_at
      - updated_at
      - attachments
      additionalProperties: false
    ThreadDetail:
      type: object
      properties:
        id: *id001
        chip_id: *id001
        macro: *id009
        title: *id002
        description: *id002
        created_at: *id003
        part_number: *id002
        board: *id002
        step_count: *id010
        status: *id004
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepDetail'
      required:
      - id
      - chip_id
      - macro
      - title
      - description
      - created_at
      - part_number
      - board
      - step_count
      - status
      - steps
      additionalProperties: false
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: lab_session
servers:
