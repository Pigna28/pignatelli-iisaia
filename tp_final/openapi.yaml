openapi: 3.1.0
info:
  title: IC Bring-up Lab API
  description: API para el registro de muestras físicas de chips y los ensayos de
    caracterización ejecutados sobre sus macros (Tx, Rx, PLL) durante el proceso de
    bring-up en laboratorio. Laboratorio compartido. Cookie de sesión en modo Auth0;
    modo local solo en loopback. Antes de escribir, obtener X-CSRF-Token de GET /session.
  version: 2.0.0
paths:
  /chips:
    get:
      summary: Listar chips
      description: Obtiene el listado de todas las muestras de chips registradas.
      operationId: listChips
      tags:
      - Chips
      responses:
        '200':
          description: Listado de chips.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chip'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso o CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Registrar un chip
      description: Crea una nueva muestra de chip.
      operationId: createChip
      tags:
      - Chips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChipInput'
      responses:
        '201':
          description: Chip creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chip'
        '400':
          description: Entrada inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso o CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /chips/{chipId}:
    delete:
      summary: Eliminar un chip
      description: Elimina una muestra física de chip y todos los ensayos asociados
        a sus macros.
      operationId: deleteChip
      tags:
      - Chips
      parameters:
      - $ref: '#/components/parameters/ChipId'
      - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Chip y ensayos asociados eliminados exitosamente. Sin contenido.
        '404':
          description: El chip indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso o CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Entrada inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chips/{chipId}/macros/{macro}/tests:
    get:
      summary: Listar ensayos de una macro
      description: 'Obtiene los ensayos de caracterización registrados para una macro
        específica de un chip. API histórica de mediciones: cada alta crea un hilo
        de un paso. Para el flujo actual usar /threads. Las filas históricas no reflejan
        ediciones posteriores de pasos.'
      operationId: listTests
      tags:
      - Tests
      parameters:
      - $ref: '#/components/parameters/ChipId'
      - $ref: '#/components/parameters/Macro'
      - name: passed
        in: query
        required: false
        description: Filtra los ensayos por resultado aprobado/fallido.
        schema:
          type: boolean
      responses:
        '200':
          description: Listado de ensayos de la macro indicada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Test'
        '400':
          description: Entrada inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El chip indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso o CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
    post:
      summary: Registrar un ensayo en una macro
      description: 'Crea un nuevo ensayo de caracterización sobre la macro indicada
        de un chip. API histórica de mediciones: cada alta crea un hilo de un paso.
        Para el flujo actual usar /threads. Las filas históricas no reflejan ediciones
        posteriores de pasos.'
      operationId: createTest
      tags:
      - Tests
      parameters:
      - $ref: '#/components/parameters/ChipId'
      - $ref: '#/components/parameters/Macro'
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestInput'
      responses:
        '201':
          description: Ensayo creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '400':
          description: Entrada inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El chip indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso o CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
  /chips/{chipId}/macros/{macro}/tests/{testId}:
    delete:
      summary: Eliminar un ensayo
      description: 'Elimina un ensayo de caracterización de una macro específica de
        un chip. API histórica de mediciones: cada alta crea un hilo de un paso. Para
        el flujo actual usar /threads. Las filas históricas no reflejan ediciones
        posteriores de pasos.'
      operationId: deleteTest
      tags:
      - Tests
      parameters:
      - $ref: '#/components/parameters/ChipId'
      - $ref: '#/components/parameters/Macro'
      - name: testId
        in: path
        required: true
        description: Identificador del ensayo.
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Ensayo eliminado exitosamente. Sin contenido.
        '400':
          description: Entrada inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El chip o el ensayo no existen en esa macro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso o CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
  /summary:
