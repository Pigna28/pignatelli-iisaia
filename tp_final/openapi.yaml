      summary: All Threads
      operationId: listAllThreads
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - in_progress
            - passed
            - failed
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thread'
        '400':
          description: Entrada inválida, sesión/permisos, jerarquía o disponibilidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Entrada inválida, sesión/permisos, jerarquía o disponibilidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
