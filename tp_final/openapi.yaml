          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Paginación inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        schema:
          type: integer
          minimum: 1
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Base accesible.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    const: ok
        '503':
          description: Base no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /logout:
    post:
      operationId: logout
      parameters:
      - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Sesión local cerrada; navegar a redirect para cerrar Auth0.
          content:
            application/json:
              schema:
                type: object
                required:
                - redirect
                properties:
                  redirect:
                    type: string
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /threads:
